<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Jarvis · Escritório</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#121212;text-decoration:none}a:hover{color:#2F5BFF}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#121212;background:#A9DCF7">
  <img src="/_blob/627782a6c9cf0980315d7296e4b6e5fd" alt="Campus 3D da Escola Prosperi" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">

  <div style="position:absolute;left:14px;right:14px;top:54px;display:flex;flex-direction:column;gap:8px">
    <div style="display:flex;gap:8px;align-items:center">
      <a href="Main.dc.html" aria-label="Voltar para Hoje" style="width:44px;height:44px;border-radius:14px;background:#F6F5F1;display:grid;place-items:center;flex:none;box-shadow:0 2px 10px rgba(0,0,0,.12)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#121212" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
      </a>
      <div style="flex:1;display:flex;align-items:center;gap:8px;background:#F6F5F1;border-radius:14px;padding:0 12px;height:44px;box-shadow:0 2px 10px rgba(0,0,0,.12)">
        <img src="/_blob/f75b82913f85335eed153e58890458f8" alt="" style="height:22px">
        <div style="font-size:14px;font-weight:800;flex:1">Escola Prosperi</div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#55534F" stroke-width="2.2" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </div>
      <div style="height:44px;border-radius:14px;background:#121212;color:#F6F5F1;padding:0 12px;display:flex;align-items:center;font-size:13px;font-weight:800;box-shadow:0 2px 10px rgba(0,0,0,.12)">230 XP</div>
    </div>
    <div style="display:flex;gap:4px;background:rgba(246,245,241,.92);border-radius:14px;padding:4px;box-shadow:0 2px 10px rgba(0,0,0,.1)">
      <sc-for list="{{ floors }}" as="f" hint-placeholder-count="4">
        <button onClick="{{ f.pick }}" style="all:unset;cursor:pointer;flex:1;text-align:center;font-size:12.5px;font-weight:700;padding:9px 0;border-radius:10px;background:{{ f.bg }};color:{{ f.ink }}">{{ f.n }}</button>
      </sc-for>
    </div>
  </div>

  <div style="position:absolute;left:150px;top:395px;display:flex;align-items:center;gap:6px;background:#FFFFFF;border-radius:999px;padding:5px 10px 5px 6px;font-size:12px;font-weight:800;box-shadow:0 2px 8px rgba(0,0,0,.18)"><span style="width:8px;height:8px;border-radius:50%;background:#C8372A"></span>Plutus</div>
  <div style="position:absolute;left:58px;top:450px;display:flex;align-items:center;gap:6px;background:#FFFFFF;border-radius:999px;padding:5px 10px 5px 6px;font-size:12px;font-weight:800;box-shadow:0 2px 8px rgba(0,0,0,.18)"><span style="width:8px;height:8px;border-radius:50%;background:#A86A00"></span>Hermes</div>
  <div style="position:absolute;left:214px;top:480px;display:flex;align-items:center;gap:6px;background:#2F5BFF;color:#fff;border-radius:999px;padding:5px 10px 5px 6px;font-size:12px;font-weight:800;box-shadow:0 2px 8px rgba(0,0,0,.18)"><span style="width:8px;height:8px;border-radius:50%;background:#fff"></span>Você</div>

  <div style="position:absolute;left:14px;right:14px;bottom:28px;display:flex;flex-direction:column;gap:10px">
    <div style="display:flex;justify-content:space-between;align-items:flex-end">
      <div aria-label="Controle de movimento" style="width:96px;height:96px;border-radius:50%;background:rgba(18,18,18,.28);border:2px solid rgba(255,255,255,.7);display:grid;place-items:center">
        <div style="width:40px;height:40px;border-radius:50%;background:#F6F5F1;box-shadow:0 3px 10px rgba(0,0,0,.25)"></div>
      </div>
      <button style="all:unset;cursor:pointer;background:#F6F5F1;border-radius:999px;padding:0 18px;height:52px;display:flex;align-items:center;font-size:15px;font-weight:800;box-shadow:0 6px 16px rgba(0,0,0,.25)">Conversar com Plutus</button>
    </div>
    <div style="background:#F6F5F1;border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 6px 20px rgba(0,0,0,.18)">
      <div style="display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:#55534F"><span>Missão do dia · Zerar atrasadas</span><span>1 de 2</span></div>
      <div style="height:6px;border-radius:6px;background:#E4E2DC;overflow:hidden"><div style="width:50%;height:100%;background:#2F5BFF"></div></div>
      <div style="display:flex;gap:16px;font-size:12px;font-weight:700"><span style="color:#C8372A">2 atrasadas</span><span style="color:#A86A00">5 vencem logo</span><span style="color:#1B7F52">8 no prazo</span></div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { f: 0 }; }
  renderVals() {
    const floors = ['Campus','Térreo','1º andar','2º andar'].map((n,i) => ({ n, bg: i===this.state.f ? '#121212' : 'transparent', ink: i===this.state.f ? '#F6F5F1' : '#121212', pick: () => this.setState({ f:i }) }));
    return { floors };
  }
}
</script>
</body>
</html>
