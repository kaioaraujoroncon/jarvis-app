<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Jarvis · Agenda</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#121212;text-decoration:none}a:hover{color:#2F5BFF}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#F6F5F1;color:#121212;font-family:'Plus Jakarta Sans',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden">
  <div style="padding:58px 22px 0;display:flex;flex-direction:column;gap:16px;flex:1;overflow:hidden">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h1 style="margin:0;font-size:32px;line-height:1.05;font-weight:800;letter-spacing:-0.02em">Agenda</h1>
      <div style="display:flex;gap:6px">
        <span style="font-size:11px;font-weight:700;padding:5px 9px;border-radius:999px;background:#FFFFFF;border:1px solid #E4E2DC">Google</span>
        <span style="font-size:11px;font-weight:700;padding:5px 9px;border-radius:999px;background:#FFFFFF;border:1px solid #E4E2DC">Notion</span>
        <span style="font-size:11px;font-weight:700;padding:5px 9px;border-radius:999px;background:#FFFFFF;border:1px solid #E4E2DC">Bots</span>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px">
      <sc-for list="{{ days }}" as="d" hint-placeholder-count="7">
        <button onClick="{{ d.pick }}" style="all:unset;cursor:pointer;display:grid;justify-items:center;gap:4px;padding:8px 0;border-radius:14px;background:{{ d.bg }};color:{{ d.ink }}">
          <span style="font-size:11px;font-weight:600;opacity:.75">{{ d.w }}</span>
          <span style="font-size:17px;font-weight:800">{{ d.n }}</span>
          <span style="width:5px;height:5px;border-radius:50%;background:{{ d.dot }}"></span>
        </button>
      </sc-for>
    </div>

    <div style="display:flex;flex-direction:column">
      <sc-for list="{{ rows }}" as="r" hint-placeholder-count="7">
        <div style="display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;align-items:start;padding:9px 0;border-top:1px solid #E4E2DC">
          <div style="font-size:13px;font-weight:700;color:#55534F;padding-top:2px;white-space:nowrap">{{ r.time }}</div>
          <div style="display:flex;gap:10px;align-items:center;background:{{ r.bg }};border-radius:12px;padding:{{ r.pad }}">
            <span style="width:4px;align-self:stretch;border-radius:4px;background:{{ r.bar }}"></span>
            <div style="flex:1;min-width:0">
              <div style="font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ r.title }}</div>
              <div style="font-size:12px;font-weight:600;color:#55534F">{{ r.meta }}</div>
            </div>
          </div>
        </div>
      </sc-for>
    </div>

    <div style="background:#121212;color:#F6F5F1;border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center">
      <div style="width:36px;height:36px;border-radius:12px;background:#2F5BFF;display:grid;place-items:center;flex:none">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/><circle cx="12" cy="12" r="3"/></svg>
      </div>
      <div style="flex:1;font-size:13px;line-height:1.4"><strong style="font-weight:800">Jarvis sugere:</strong> encaixar "Ligar para famílias" às 16h, entre a reunião e o fechamento.</div>
      <button style="all:unset;cursor:pointer;font-size:13px;font-weight:800;color:#121212;background:#F6F5F1;border-radius:10px;padding:10px 12px;min-height:24px">Encaixar</button>
    </div>
  </div>

  <nav style="flex:none;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:end;padding:8px 10px 26px;background:#F6F5F1;border-top:1px solid #E4E2DC">
    <a href="Main.dc.html" style="display:grid;justify-items:center;gap:3px;font-size:11px;font-weight:600;color:#6B6A66;min-height:44px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Hoje</a>
    <a href="Agenda.dc.html" style="display:grid;justify-items:center;gap:3px;font-size:11px;font-weight:700;color:#121212;min-height:44px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Agenda</a>
    <a href="Escritorio.dc.html" aria-label="Escritório" style="justify-self:center;width:58px;height:58px;margin-top:-22px;border-radius:18px;background:#2F5BFF;display:grid;place-items:center;color:#fff;box-shadow:0 8px 18px rgba(47,91,255,.35)"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 21h18M5 21V8l7-5 7 5v13M9 21v-5h6v5"/></svg></a>
    <a href="Conversa.dc.html" style="display:grid;justify-items:center;gap:3px;font-size:11px;font-weight:600;color:#6B6A66;min-height:44px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>Conversas</a>
    <a href="Main.dc.html" style="display:grid;justify-items:center;gap:3px;font-size:11px;font-weight:600;color:#6B6A66;min-height:44px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Você</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { day: 1 }; }
  renderVals() {
    const W = ['seg','ter','qua','qui','sex','sáb','dom'], N = [23,24,25,26,27,28,29], dots = ['#C8372A','#A86A00','#1B7F52','#1B7F52','#A86A00','transparent','transparent'];
    const days = W.map((w,i) => ({ w, n:N[i], dot: dots[i], bg: i===this.state.day ? '#121212' : 'transparent', ink: i===this.state.day ? '#F6F5F1' : '#121212', pick: () => this.setState({ day:i }) }));
    const rows = [
      { time:'05:40', title:'Resumo falado do Jarvis', meta:'Rotina · ouvido', bar:'#2F5BFF', bg:'transparent', pad:'2px 0' },
      { time:'08:00', title:'Abertura da secretaria', meta:'Google Agenda', bar:'#9C9A94', bg:'transparent', pad:'2px 0' },
      { time:'10:30', title:'Conferir boletos vencidos', meta:'Plutus · atrasada', bar:'#C8372A', bg:'#FBE3DF', pad:'8px 10px' },
      { time:'14:00', title:'Reunião de orçamento 2027', meta:'Google Agenda · Sala de reunião', bar:'#A86A00', bg:'#FFF1CC', pad:'8px 10px' },
      { time:'16:00', title:'Livre', meta:'1h30 sem compromisso', bar:'#E4E2DC', bg:'transparent', pad:'2px 0' },
      { time:'17:30', title:'Fechar caixa da semana', meta:'Notion · Plutus', bar:'#1B7F52', bg:'transparent', pad:'2px 0' },
      { time:'18:00', title:'Treino de tênis', meta:'Pessoal · Federer', bar:'#1B7F52', bg:'transparent', pad:'2px 0' }
    ];
    return { days, rows };
  }
}
</script>
</body>
</html>
