<script type="text/x-central">
/*PARSER-INICIO*/
var VozParser = (function () {
  'use strict';
  var NUM = { um:1, uma:1, primeira:1, primeiro:1, dois:2, duas:2, segunda:2, segundo:2, tres:3, terceira:3, terceiro:3,
    quatro:4, quarta:4, quarto:4, cinco:5, quinta:5, quinto:5, seis:6, sete:7, oito:8, nove:9, dez:10, onze:11, doze:12,
    treze:13, catorze:14, quatorze:14, quinze:15, dezesseis:16, dezessete:17, dezoito:18, dezenove:19, vinte:20, trinta:30 };
  var DIAS = { domingo:0, segunda:1, 'segunda-feira':1, terca:2, 'terca-feira':2, quarta:3, 'quarta-feira':3, quinta:4, 'quinta-feira':4, sexta:5, 'sexta-feira':5, sabado:6 };
  var MESES = { janeiro:1, fevereiro:2, marco:3, abril:4, maio:5, junho:6, julho:7, agosto:8, setembro:9, outubro:10, novembro:11, dezembro:12 };
  var PARA = '(?:para|pra|pro|ate|até)';
  var STOP = { o:1,a:1,os:1,as:1,de:1,do:1,da:1,dos:1,das:1,no:1,na:1,nos:1,nas:1,em:1,e:1,que:1,item:1,tarefa:1,para:1,pra:1,pro:1,um:0,uma:0,com:1,por:1,ao:1,se:1,me:1,isso:1 };

    return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[.,;:!?"“”()]/g, ' ').replace(/\s+/g, ' ').trim();
  }
  function pad(n) { return ('0' + n).slice(-2); }
  function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function dataDe(isoStr) { var p = isoStr.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function soma(isoStr, n) { var d = dataDe(isoStr); d.setDate(d.getDate() + n); return iso(d); }
  function numero(t) { return /^\d+$/.test(t) ? +t : (NUM[t] || 0); }

  /** "sexta", "amanha", "dia 20", "20/11", "20 de novembro", "semana que vem", "em 3 dias" → aaaa-mm-dd (sempre > hoje) ou ''. */
  function data(txt, hoje) {
    var t = norm(txt).replace(/^(a |o |na |no |dia |de )+/, function (m) { return /dia/.test(m) ? 'dia ' : ''; });

    if (/^(semana que vem|proxima semana|uma semana|1 semana)$/.test(t)) return soma(hoje, 7);
    if (/^(mes que vem|proximo mes)$/.test(t)) { var d0 = dataDe(hoje); d0.setMonth(d0.getMonth() + 1); return iso(d0); }

    if (m && numero(m[1])) return soma(hoje, numero(m[1]) * (/semana/.test(m[2]) ? 7 : 1));
    m = t.match(/^(?:(?:a |na |no )?(?:proxima|proximo) )?(domingo|segunda|terca|quarta|quinta|sexta|sabado)(?:-feira| feira)?(?: que vem)?$/);
    if (m) { var alvo = DIAS[m[1]], dd = dataDe(hoje), dif = (alvo - dd.getDay() + 7) % 7 || 7; return soma(hoje, dif); }
    m = t.match(/^(\d{1,2})[\/\-](\d{1,2})(?:[\/\-](\d{2,4}))?$/);
    if (m) return futura(+m[1], +m[2], m[3], hoje);
    m = t.match(/^(?:dia )?(\w+)(?: de (\w+))?$/);
    if (m && numero(m[1]) && numero(m[1]) <= 31) {
      var mes = m[2] ? MESES[m[2]] : 0;
      if (m[2] && !mes) return '';
      return futura(numero(m[1]), mes, null, hoje);
    }

  }
  function futura(dia, mes, ano, hoje) {

    if (q.length >= 4 && w.indexOf(q) === 0) return 0.9;         // "contab" ~ "contabilidade"
    if (q.length >= 5 && lev(q, w) <= 1) return 0.85;             // erro de reconhecimento
    if (q.length >= 7 && lev(q, w) <= 2) return 0.7;

  }

      var cobertos = alvo.filter(function (w) { return qt.some(function (q) { return parecido(q, w) > 0; }); }).length;

      if (it.pendente) score += 0.05;

      .sort(function (a, b) { return b.score - a.score; }).slice(0, 3);

    { re: /^(?:desfaz|desfazer|volta|voltar)$/, f: function () { return { acao: 'desfazer' }; } },
    { re: /^(?:feito|fiz|ja fiz|conclui|concluido|concluida|terminei|marca(?:r)?(?: como)? feito)(?: o| a)? (.+)$/, f: function (m) { return { acao: 'feito', ref: m[1] }; } },
    { re: /^(.+?) (?:feito|ja fiz|concluido|concluida|pronto)$/, f: function (m) { return { acao: 'feito', ref: m[1] }; } },
    { re: new RegExp('^(?:adia|adiar|adie|adiei|empurra|joga|deixa)(?: o| a)? (.+?) ' + PARA + ' (?:a |o )?(.+)$'), f: function (m) { return { acao: 'adiar', ref: m[1], quando: m[2] }; } },
    { re: new RegExp('^(.+?) (?:adia|adiar|adiado) ' + PARA + ' (.+)$'), f: function (m) { return { acao: 'adiar', ref: m[1], quando: m[2] }; } },
    { re: /^(?:adia|adiar|adie)(?: o| a)? (.+)$/, f: function (m) { return { acao: 'adiar', ref: m[1], quando: 'amanha' }; } },
    { re: /^(?:opcao|alternativa|escolha|escolho) (\w+) (?:no|na|para|pro|pra|em|do|da) (.+)$/, f: function (m) { return { acao: 'opcao', n: numero(m[1]), ref: m[2] }; } },
    { re: /^(.+?) (?:opcao|alternativa|escolha) (\w+)$/, f: function (m) { return { acao: 'opcao', n: numero(m[1 + 1]), ref: m[1] }; } },
    { re: /^(?:no|na|em|para|pro|pra)? ?(.+?) (?:escolhe|escolho|responde|resposta) (sim|nao)$/, f: function (m) { return { acao: 'opcaoTexto', v: m[2], ref: m[1] }; } },
    { re: /^(?:responde|resposta|anota|escreve|nota)(?: no| na| para| pro| pra| em)? (.+?) (?:dizendo|que|texto|assim|:) (.+)$/, f: function (m) { return { acao: 'texto', ref: m[1], texto: m[2] }; } },
    { re: /^(?:abre|abrir|mostra|mostrar|vai para|ir para|ver) (?:o |a )?(.+)$/, f: function (m) { return { acao: 'abrir', ref: m[1] }; } },
    { re: /^(?:missao) (\w+)(?: (feito|feita|concluida))?$/, f: function (m) { return { acao: m[2] ? 'feito' : 'abrir', missao: numero(m[1]) }; } }
  ];

  /**
   * frase: o que foi falado/digitado. ctx = { hoje, itens:[{id,titulo,area,bot,pendente,opcoes[]}], missoes:[{n,id}], focado: id|null }
   * Retorna { acao, alvo:{id,titulo}|null, candidatos[], valor, data, texto, ouvi, problema }
   */
  function entender(frase, ctx) {
    var original = String(frase || '').trim(), f = norm(original);
    var out = { ouvi: original, acao: '', alvo: null, candidatos: [], problema: '' };
    if (!f) { out.problema = 'Não ouvi nada.'; return out; }
    var cmd = null;
    for (var i = 0; i < REGRAS.length && !cmd; i++) { var m = f.match(REGRAS[i].re); if (m) cmd = REGRAS[i].f(m); }
    if (!cmd) {
      // Sem comando: vira texto ditado no item focado (o último que o Kaio tocou)
      if (ctx.focado) cmd = { acao: 'texto', texto: original, idFixo: ctx.focado };
      else { out.problema = 'Não entendi o comando. Exemplos: "feito pagar contador", "adia folha para sexta", "prazos opção 1".'; return out; }
    }
    out.acao = cmd.acao; out.cmd = cmd;
    if (cmd.acao === 'desfazer') return out;
    if (cmd.missao) {
      var ms = (ctx.missoes || []).filter(function (x) { return +x.n === cmd.missao; })[0];
      if (!ms) { out.problema = 'Não achei a missão ' + cmd.missao + '.'; return out; }
      cmd.idFixo = ms.id;
    }
    if (cmd.idFixo) {
      var it0 = ctx.itens.filter(function (x) { return x.id === cmd.idFixo; })[0];
      out.candidatos = it0 ? [{ id: it0.id, titulo: it0.titulo, score: 2 }] : [];
    } else {
      out.candidatos = achar(cmd.ref, ctx.itens);
    }
    if (!out.candidatos.length) { out.problema = 'Não achei nenhum item parecido com "' + (cmd.ref || '') + '".'; return out; }
    out.duvida = out.candidatos.length > 1 && out.candidatos[0].score < 2 && out.candidatos[0].score - out.candidatos[1].score < 0.15;
    return completar(out, out.candidatos[0].id, ctx);

  /** Preenche data/opção/texto para o item escolhido (usado também quando o Kaio troca o item na confirmação). */

    out.alvo = out.candidatos.filter(function (c) { return c.id === id; })[0] || { id: id, titulo: item.titulo, score: 2 };
    out.problema = ''; out.valor = undefined; out.data = ''; out.acao = cmd.acao === 'opcaoTexto' ? 'opcao' : cmd.acao;

      out.data = data(cmd.quando, ctx.hoje);

      else out.valor = ops[cmd.n - 1];

    if (cmd.acao === 'opcaoTexto') {
      out.valor = (item.opcoes || []).filter(function (o) { return norm(o) === cmd.v; })[0] || '';
      if (!out.valor) out.problema = 'Esse item não tem a opção "' + cmd.v + '".';
    }
    if (cmd.acao === 'texto') out.texto = cmd.texto;

  }
  function escolher(out, id, ctx) { out.duvida = false; return completar(out, id, ctx); }

  return { entender: entender, escolher: escolher, achar: achar, data: data, norm: norm };
})();

<script type="text/x-central">
/* ---------- Tela: barra de comando, microfone e confirmação ---------- */
(function () {
  'use strict';
  var API = window.CentralAPI; if (!API) return;
  var $ = function (id) { return document.getElementById(id); };
  var esc = API.esc;
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var micBloqueado = false, rec = null, pendente = null;

  // 1) Microfone só aparece se o navegador tem reconhecimento E a política do iframe permite microfone.
  function politicaMic() {
    try { if (document.featurePolicy) return document.featurePolicy.allowsFeature('microphone'); } catch (e) {}
    try { if (document.permissionsPolicy) return document.permissionsPolicy.allowsFeature('microphone'); } catch (e) {}
    return null; // desconhecido (Safari): tenta e trata o erro
  }
  function micDisponivel() { return !!SR && politicaMic() !== false && !micBloqueado; }

  function montar() {
    var barra = document.createElement('div');
    barra.className = 'cmd';
    barra.innerHTML = '<input id="cmdTxt" type="text" enterkeyhint="go" autocomplete="off" placeholder="Comando: “feito pagar13”, “adia … para sexta”">' +
      '<button id="cmdMic" type="button" aria-label="Falar comando"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg></button>';
    var alvo = $('topoFila'); alvo.insertBefore(barra, alvo.firstChild);
    var vivo = document.createElement('div'); vivo.className = 'cmd-ao-vivo'; vivo.id = 'cmdVivo';
    alvo.insertBefore(vivo, barra.nextSibling);
    if (!micDisponivel()) $('cmdMic').style.display = 'none';
    $('cmdMic').onclick = ouvir;
    $('cmdTxt').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); processar([this.value]); } });
  }

  // 2) Reconhecimento (Web Speech API). Usa até 3 alternativas e fica com a que gera comando válido.
  function ouvir() {
    if (rec) { rec.stop(); return; }
    rec = new SR(); rec.lang = 'pt-BR'; rec.interimResults = true; rec.maxAlternatives = 3; rec.continuous = false;
    $('cmdMic').classList.add('ouvindo'); $('cmdVivo').textContent = 'Ouvindo…';
    rec.onresult = function (ev) {
      var r = ev.results[ev.results.length - 1];
      $('cmdVivo').textContent = r[0].transcript;
      if (r.isFinal) { var alts = []; for (var i = 0; i < r.length; i++) alts.push(r[i].transcript); processar(alts); }
    };
    rec.onerror = function (ev) {
      if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed' || ev.error === 'audio-capture') {
        micBloqueado = true; $('cmdMic').style.display = 'none';
        API.toast('Microfone bloqueado aqui. Use o microfone do teclado na barra de comando: funciona igual.', true);
        $('cmdTxt').focus();
      } else if (ev.error === 'no-speech') { $('cmdVivo').textContent = 'Não ouvi nada. Toque no microfone e fale.'; }
      else { $('cmdVivo').textContent = 'Erro no reconhecimento: ' + ev.error; }
    };
    rec.onend = function () { rec = null; $('cmdMic').classList.remove('ouvindo'); };
    try { rec.start(); } catch (e) { rec = null; $('cmdMic').classList.remove('ouvindo'); }
  }

  // 3) Entende, escolhe a melhor alternativa e pede confirmação.
  function processar(alternativas) {
    var ctx = API.contexto(), melhor = null;
    alternativas.some(function (a) {
      var p = VozParser.entender(a, ctx);
      if (!melhor || (!p.problema && melhor.problema) || (p.alvo && melhor.alvo && p.alvo.score > melhor.alvo.score && !p.problema)) melhor = p;
      return !p.problema && p.alvo && p.alvo.score >= 2;
    });
    $('cmdVivo').textContent = '';
    if (melhor.acao === 'desfazer') { API.desfazer(); return; }
    if (melhor.problema && !melhor.alvo) { API.toast(melhor.problema, true); return; }
    pendente = melhor; confirmar();
  }

  function descrever(p) {
    var t = '"' + p.alvo.titulo + '"';
    if (p.acao === 'feito') return 'Marcar como feito: ' + t;
    if (p.acao === 'adiar') return '⏸ Adiar ' + t + (p.data ? ' até ' + p.data.slice(8, 10) + '/' + p.data.slice(5, 7) : '');
    if (p.acao === 'opcao') return 'Escolher "' + (p.valor || '?') + '" em ' + t;
    if (p.acao === 'texto') return '✎ Escrever em ' + t + ': "' + p.texto + '"';
    if (p.acao === 'abrir') return 'Abrir ' + t;
    return t;
  }

  function confirmar() {
    var p = pendente, box = $('vozConf');
    if (!box) { box = document.createElement('div'); box.id = 'vozConf'; box.className = 'conf'; document.body.appendChild(box); }
    if (p.acao === 'abrir' && !p.duvida) { fechar(); API.irPara(p.alvo.id); return; }
    var alt = p.candidatos.length > 1 ? '<div class="mut" style="margin-bottom:6px">' + (p.duvida ? 'Qual destes?' : 'Ou era outro?') + '</div><div class="alt">' +
      p.candidatos.map(function (c) { return '<button type="button" data-id="' + esc(c.id) + '" class="' + (c.id === p.alvo.id ? 'on' : '') + '">' + esc(c.titulo) + '</button>'; }).join('') + '</div>' : '';
    box.innerHTML = '<h3>Confirma?</h3><div class="o-que">' + esc(descrever(p)) + '</div>' +
      '<div class="ouvi">Ouvi: "' + esc(p.ouvi) + '"' + (p.problema ? ' · <span style="color:#ff8a8a">' + esc(p.problema) + '</span>' : '') + '</div>' + alt +
      '<div class="bts"><button type="button" id="vozNao">Cancelar</button><button type="button" class="sim" id="vozSim"' + (p.problema || p.duvida ? ' disabled style="opacity:.4"' : '') + '>Confirmar</button></div>';
    box.style.display = 'block';
    $('vozNao').onclick = fechar;
    $('vozSim').onclick = aplicar;
    Array.prototype.forEach.call(box.querySelectorAll('.alt button'), function (b) {
      b.onclick = function () {
        VozParser.escolher(p, b.dataset.id, API.contexto());
        confirmar();
      };
    });
  }
  function fechar() { var b = $('vozConf'); if (b) b.style.display = 'none'; pendente = null; }

  function aplicar() {
    var p = pendente; if (!p || p.problema || p.duvida) return;
    fechar(); $('cmdTxt').value = '';
    if (p.acao === 'feito') API.aplicar(p.alvo.id, { acao: 'feito' });
    else if (p.acao === 'adiar') API.aplicar(p.alvo.id, { acao: 'adiar', adiar: p.data });
    else if (p.acao === 'opcao') API.aplicar(p.alvo.id, { escolha: p.valor });
    else if (p.acao === 'texto') API.aplicar(p.alvo.id, { textoAnexar: p.texto });
    else if (p.acao === 'abrir') API.irPara(p.alvo.id);
  }

  montar();
  window.__voz = { diagnostico: function () {
    return { speechRecognition: !!SR, politicaMicrofone: politicaMic(), mediaDevices: !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia), ua: navigator.userAgent };
  } };
})();
</script>

</body>
